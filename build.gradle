plugins {
    id 'java'
    alias(libs.plugins.spring.boot)
}

group = 'com.paultinius.k8s'
version = '1.0.0-SNAPSHOT'
description = 'Local Kubernetes dashboard for multi-cluster management'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

 repositories {
    mavenLocal()
    mavenCentral()
    // maven {
    //   url "https://nexus.global.lmco.com/repository/efoss-maven"
    //   credentials {
    //     username = "${System.getProperty("wrapperUser") ?: System.getenv("EFOSS_USER")}"
    //     password = "${System.getProperty("wrapperPassword") ?: System.getenv("EFOSS_TOKEN")}"
    //   }
    // }
    // maven {
    //     url "https://nexus.us.lmco.com/repository/efoss-maven"
    //     credentials {
    //         username = "${System.getProperty("wrapperUser") ?: System.getenv("EFOSS_USER")}"
    //         password = "${System.getProperty("wrapperPassword") ?: System.getenv("EFOSS_TOKEN")}"
    //     }
    // }
    // maven {
    //     url "https://nexus-ent-dev.us.lmco.com/repository/maven-central-proxy/"
    // }
}

dependencies {
    implementation platform(libs.spring.boot.dependencies)
    implementation libs.spring.boot.starter.web
    implementation libs.spring.boot.starter.actuator
    implementation libs.spring.boot.starter.validation
    implementation libs.spring.boot.starter.security
    implementation libs.spring.security.ldap
    implementation libs.fabric8.kubernetes.client

    testImplementation platform(libs.spring.boot.dependencies)
    testImplementation libs.spring.boot.starter.test
    testImplementation libs.spring.security.test
    testImplementation libs.unboundid.ldapsdk
    testRuntimeOnly libs.junit.platform.launcher
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.compilerArgs += ['-parameters']
}

tasks.named('bootJar') {
    archiveFileName = 'k8s-dashboard.jar'
}

def dockerImage = "${rootProject.name}:${version}"

tasks.register('dockerBuild', Exec) {
    group = 'build'
    description = "Build the ${dockerImage} image from the Dockerfile."
    commandLine 'docker', 'build', '--tag', dockerImage, '.'
}

tasks.named('assemble') {
    dependsOn 'dockerBuild'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat = 'full'
    }
}
