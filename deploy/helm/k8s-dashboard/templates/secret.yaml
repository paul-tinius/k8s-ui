{{- if eq (include "k8s-dashboard.managedSecret" .) "true" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "k8s-dashboard.secretName" . }}
  labels:
    {{- include "k8s-dashboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secret.tokenKey }}: {{ .Values.auth.token | quote }}
  {{ .Values.secret.apiKeyKey }}: {{ .Values.ai.apiKey | quote }}
{{- end }}
