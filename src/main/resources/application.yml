spring:
  application:
    name: k8s-dashboard
  web:
    resources:
      cache:
        # Short-lived rather than 0: static assets aren't content-hashed, so a
        # long max-age could serve a stale app.js/app.css after an upgrade, but
        # 0 forces a full re-download of both on every single page load.
        period: 60s

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: always
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json,image/svg+xml
    min-response-size: 1024

management:
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    # Adding spring-security-ldap pulls in Spring Boot's own LDAP health
    # indicator, which otherwise defaults to ldap://localhost:389 and reports
    # DOWN whenever LDAP login is disabled. Only check connectivity when
    # dashboard.ldap.enabled actually turns LDAP login on.
    ldap:
      enabled: ${dashboard.ldap.enabled:false}

dashboard:
  ldap:
    enabled: false
    host: ""
    port: 3269
    default-domain: ""
    search-base-dn: ""
    group: ""
    bind-username: ""
    bind-password: ""
  cluster:
    demo-enabled: true
    load-default-kubeconfig: true
    in-cluster: false
    data-dir: ${user.home}/.k8s-dashboard
    kubeconfigs: []
  ai:
    provider: off
    base-url: ""
    model: ""
    api-key: ""
    timeout: 90s
  live:
    resource-interval: 3s
    log-interval: 2s

logging:
  level:
    com.paultinius.k8s.dashboard: INFO
