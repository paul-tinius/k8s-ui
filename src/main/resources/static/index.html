<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Kubernetes Dashboard</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script>
    (function () {
      var theme = "system";
      try {
        var saved = localStorage.getItem("k8s-dashboard-theme");
        if (saved === "dark" || saved === "light" || saved === "system") theme = saved;
      } catch (error) {
        theme = "system";
      }
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="gate" class="gate hidden">
    <form id="gate-form" class="gate-card">
      <h1>Kubernetes Dashboard</h1>
      <p>This server expects an access token. It stays in this browser tab.</p>
      <label for="gate-token">Access token</label>
      <input id="gate-token" type="password" autocomplete="current-password" required>
      <button type="submit">Unlock</button>
      <p id="gate-error" class="error"></p>
    </form>
  </div>
  <div class="app">
    <header class="top">
      <div class="brand">
        <img src="favicon.svg" alt="" width="28" height="28">
        <div>
          <strong>Kubernetes Dashboard</strong>
          <span>Local multi-cluster</span>
        </div>
      </div>
      <label class="cluster-pick">
        <span>Cluster</span>
        <select id="cluster"></select>
      </label>
      <label class="search">
        <span>Search</span>
        <input id="query" type="search" placeholder="Name, label, status, image" autocomplete="off">
      </label>
      <label class="live">
        <input id="live" type="checkbox" checked>
        Live
      </label>
      <label class="theme-pick">
        <span>Theme</span>
        <select id="theme">
          <option value="system">System</option>
          <option value="dark">Dark</option>
          <option value="light">Light</option>
        </select>
      </label>
      <div class="top-actions">
        <button type="button" id="apply-open">Apply YAML</button>
        <button type="button" id="clusters-open">Manage</button>
      </div>
    </header>
    <div class="refine">
      <label>Label <input id="label" placeholder="app=storefront" autocomplete="off"></label>
      <label>Image <input id="image" placeholder="grafana/agent" autocomplete="off"></label>
      <label>Node <input id="node" placeholder="node-a" autocomplete="off"></label>
      <span id="counts"></span>
      <span id="notice" class="notice"></span>
    </div>
    <div class="body" id="workspace">
      <aside class="namespaces">
        <div class="rail-tools">
          <button type="button" id="namespace-collapse" aria-expanded="true" aria-controls="namespace-body" aria-label="Hide namespaces">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
            <span class="rail-label">Namespaces</span>
          </button>
        </div>
        <div id="namespace-body">
          <div class="aside-head">
            <h2>Namespaces</h2>
            <button type="button" id="ns-all">All</button>
          </div>
          <div id="namespace-list"></div>
        </div>
      </aside>
      <main>
        <nav class="tabs" id="tabs">
          <button type="button" data-tab="overview">Overview</button>
          <button type="button" data-tab="pods">Pods</button>
          <button type="button" data-tab="deployments">Deployments</button>
          <button type="button" data-tab="services">Services</button>
          <button type="button" data-tab="configmaps">ConfigMaps</button>
          <button type="button" data-tab="nodes">Nodes</button>
          <button type="button" data-tab="events">Events</button>
          <button type="button" data-tab="logs">Logs</button>
          <button type="button" data-tab="forwards">Port forward</button>
          <button type="button" data-tab="assist">Assist</button>
          <button type="button" data-tab="management">Management</button>
        </nav>
        <section id="view"></section>
      </main>
      <aside id="detail" class="detail">
        <div class="rail-tools">
          <button type="button" id="detail-collapse" aria-expanded="true" aria-controls="detail-body" aria-label="Hide manifest">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
            <span class="rail-label">Manifest</span>
          </button>
        </div>
        <div id="detail-body">
          <p class="muted">Select a resource to see its manifest and actions.</p>
        </div>
      </aside>
      <div id="split-namespaces" class="splitter" role="separator" aria-orientation="vertical" aria-label="Resize namespaces" tabindex="0"></div>
      <div id="split-detail" class="splitter" role="separator" aria-orientation="vertical" aria-label="Resize manifest" tabindex="0"></div>
    </div>
  </div>
  <div id="modal" class="modal hidden"></div>
  <script src="app.js"></script>
</body>
</html>
